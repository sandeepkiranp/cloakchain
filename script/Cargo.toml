[package]
version = "0.1.0"
name = "cloakkchain-script"
edition = "2021"
default-run = "cloakkchain"

[[bin]]
name = "cloakkchain"
path = "src/bin/main.rs"

[dependencies]
cloakkchain-lib = { path = "../lib" }
cloakkchain-circuit-spend = { path = "../circuit-spend" }
cloakkchain-circuit-coinproof = { path = "../circuit-coinproof" }
cloakkchain-circuit-wrap = { path = "../circuit-wrap" }

ark-relations = { workspace = true }
ark-std = { workspace = true }
ark-serialize = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-mnt4-753 = { workspace = true }
ark-mnt6-753 = { workspace = true }

bincode = { version = "1.3.3" }
sha2 = { version = "0.10.8" }
clap = { version = "4.0", features = ["derive", "env"] }
hex = "0.4.3"
