[workspace]
# `script` (the SP1 host driver) is intentionally left out of the active
# member list until Phase 4 of the MNT-native port rewrites it — it still
# references the now-deleted SP1 guest ELFs and would fail to build.
members = ["lib", "circuit-spend", "circuit-coinproof", "circuit-wrap"]
resolver = "2"

[workspace.dependencies]
ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
ark-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-groth16 = "0.5"
ark-r1cs-std = "0.5"
ark-crypto-primitives = "0.5"
ark-mnt4-753 = "0.5"
ark-mnt6-753 = "0.5"
